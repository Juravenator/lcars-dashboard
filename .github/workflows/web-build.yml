name: web-build

on:
  workflow_call:

jobs:
  greeter:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
    - run: cd web && npm ci
    - uses: extractions/setup-just@v3
    - run: cd web && just build
